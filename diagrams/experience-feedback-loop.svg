<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Do the work, then improve the workspace</title><desc id="desc">The employee journey connects an interactive report, definition, query table, documentation, and scoped answer. Optional steps and loopbacks remain possible. An administrator uses safe aggregate evidence to revise a versioned experience, and evaluates later observations without a causal claim.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#61748c"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b43}.title{font-size:26px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.s{font-size:15px}.line{fill:none;stroke:#61748c;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="610" rx="18" fill="#f5f8fc"/><text x="32" y="42" class="title">Do the work. Improve the workspace.</text>
<text x="32" y="72" class="b">Synthetic Finance investigation • product-direction journey, not an implemented UI</text>
<text x="32" y="110" class="h">EMPLOYEE</text>
<rect x="32" y="130" width="278" height="114" rx="12" fill="#fff" stroke="#b4c7de"/>
<text x="50" y="161" class="h">Open Finance → report</text><text x="50" y="192" class="b">Find and interact in place</text><text x="50" y="221" class="s">Supported authenticated BI surface</text>
<path d="M312 187H333" class="line"/>
<rect x="336" y="130" width="288" height="114" rx="12" fill="#fff" stroke="#b4c7de"/>
<text x="354" y="161" class="h">Definition → credits query</text><text x="354" y="192" class="b">Run an approved template</text><text x="354" y="221" class="s">View typed rows, units, completeness</text>
<path d="M626 187H647" class="line"/>
<rect x="650" y="130" width="278" height="114" rx="12" fill="#fff" stroke="#b4c7de"/>
<text x="668" y="161" class="h">Close note → Ask IQ</text><text x="668" y="192" class="b">Inspect evidence, then save</text><text x="668" y="221" class="s">Separate query/context authorization</text>
<path d="M789 245V268H171V248" class="line"/>
<text x="480" y="297" class="b" text-anchor="middle">Optional steps and loopbacks • native handoff ends observation, not necessarily the task</text>
<path d="M480 310V332" class="line"/>
<rect x="32" y="336" width="896" height="66" rx="10" fill="#142f4e"/>
<text x="480" y="363" class="h" text-anchor="middle" style="fill:#fff">Validate + minimize → scoped event journey → authorized aggregates</text>
<text x="480" y="388" class="s" text-anchor="middle" style="fill:#c8dbed">No raw search, SQL, results, filters, questions, answers, identities, or full URLs</text>
<text x="32" y="438" class="h">ADMINISTRATOR</text>
<rect x="32" y="454" width="278" height="98" rx="12" fill="#e2f1ed" stroke="#8cb6aa"/>
<text x="50" y="486" class="h">Inspect friction</text><text x="50" y="516" class="b">Zero-result searches + gaps</text><text x="50" y="540" class="s">Small cohorts suppressed</text>
<path d="M312 502H333" class="line"/>
<rect x="336" y="454" width="288" height="98" rx="12" fill="#e2f1ed" stroke="#8cb6aa"/>
<text x="354" y="486" class="h">Change the experience</text><text x="354" y="516" class="b">Preview → validate → publish</text><text x="354" y="540" class="s">Versioned settings; access unchanged</text>
<path d="M626 502H647" class="line"/>
<rect x="650" y="454" width="278" height="98" rx="12" fill="#e2f1ed" stroke="#8cb6aa"/>
<text x="668" y="486" class="h">Evaluate next journeys</text><text x="668" y="516" class="b">Equivalent windows / coverage</text><text x="668" y="540" class="s">Descriptive association, not causality</text>
<text x="32" y="586" class="b">The next configuration shapes future work. Real collection requires separate privacy approval.</text>
</svg>
